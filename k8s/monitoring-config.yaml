# 1. Expose the Producer port
apiVersion: v1
kind: Service
metadata:
  name: producer-metrics
  labels:
    app: producer
spec:
  selector:
    app: producer
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
---
# 2. Tell Prometheus to scrape the Producer
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: producer-monitor
  labels:
    release: monitoring  
spec:
  selector:
    matchLabels:
      app: producer
  endpoints:
  - port: metrics
    interval: 5s
---
# 3. Expose the Consumer port
apiVersion: v1
kind: Service
metadata:
  name: consumer-metrics
  labels:
    app: consumer
spec:
  selector:
    app: consumer
  ports:
  - name: metrics
    port: 8081
    targetPort: 8081
---
# 4. Tell Prometheus to scrape the Consumer
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: consumer-monitor
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: consumer
  endpoints:
  - port: metrics
    interval: 5s