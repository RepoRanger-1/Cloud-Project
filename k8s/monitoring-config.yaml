# Metrics endpoints for Prometheus (see prometheus.yaml). ServiceMonitor CRDs removed so this works
# without kube-prometheus-stack.
apiVersion: v1
kind: Service
metadata:
  name: producer-metrics
  labels:
    app: producer
spec:
  selector:
    app: producer
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-metrics
  labels:
    app: consumer
spec:
  selector:
    app: consumer
  ports:
  - name: metrics
    port: 8081
    targetPort: 8081
