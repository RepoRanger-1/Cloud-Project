apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-producer
  template:
    metadata:
      labels:
        app: api-producer
    spec:
      containers:
      - name: api-producer
        image: api-producer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: PORT
          value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: api-producer
spec:
  selector:
    app: api-producer
  ports:
  - name: http
    port: 4000
    targetPort: 4000
